<style>

a{color:#0E5A52;text-decoration:none}a:hover{color:#0A443E}

</style>

<div style="width: 390px; height: 960px; box-sizing: border-box; display: flex; flex-direction: column; background: #F7F4EE; overflow: hidden;">
<main style="flex-grow: 1; padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 16px;">
<header style="display: flex; flex-direction: column; gap: 0px;">
<h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 32px; line-height: 1.15; letter-spacing: -0.01em;">Useful Sentences</h1>
<span style="font-size: 16px; color: #5B606B;">ප්‍රයෝජනවත් වාක්‍ය</span>

<label style="height: 52px; box-sizing: border-box; border-radius: 16px; background: #FFFFFF; border: 1px solid #E7E1D6; display: flex; align-items: center; gap: 10px; padding: 0 16px; color: #5B606B;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>

</label>

<div style="display: flex; flex-direction: column; gap: 10px;">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="7">
<a href="SentenceList.dc.html" style="background: #FFFFFF; border-radius: 20px; padding: 14px 16px; display: flex; align-items: center; gap: 14px; color: #16181D; border: 1px solid #EEE8DD;">
<sc-if value="{{g.teal}}" hint-placeholder-val="{{ false }}"><span style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 15px; background: #E3F0EC; color: #0E5A52; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{g.icon}}"></path></svg></span></sc-if>
<sc-if value="{{g.saffron}}" hint-placeholder-val="{{ true }}"><span style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 15px; background: #FBEEDC; color: #9A5409; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{g.icon}}"></path></svg></span></sc-if>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column;">
<span style="font-size: 17px; font-weight: 700; line-height: 1.3;">{{g.en}}</span>
<span style="font-size: 14px; color: #5B606B;">{{g.si}}</span>
<span style="font-size: 12.5px; color: #6B707A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px;">{{g.preview}}</span>
</div>
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B606B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="m9 6 6 6-6 6"></path></svg>
</a>
</sc-for>

<sc-if value="{{c.saffron}}" hint-placeholder-val="{{ false }}"><span style="width: 38px; height: 38px; border-radius: 12px; background: #FBEEDC; color: #9A5409; display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 19px;">{{c.letter}}</span></sc-if>
<div style="display: flex; flex-direction: column; gap: 2px; margin-top: auto;">

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const list = [
      ['Animals', 'සතුන්'],
      ['Birds', 'පක්ෂීන්'],
      ['Fish & Insects', 'මාළු සහ කෘමීන්'],
      ['Plants & Trees', 'ශාක සහ ගස්'],
      ['Fruits & Vegetables', 'පළතුරු සහ එළවළු'],
      ['Agriculture', 'කෘෂිකර්මය'],
      ['Geography', 'භූගෝල විද්‍යාව']
    ];
    return {
      cats: list.map((c, i) => ({ en: c[0], si: c[1], letter: c[0].charAt(0), teal: i % 2 === 0, saffron: i % 2 === 1 }))
    };
  }
}
</script>

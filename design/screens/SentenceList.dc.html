<main style="flex-grow: 1; padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 12px;">

<sc-for list="{{items}}" as="s" hint-placeholder-count="4">
<article style="background: #FFFFFF; border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; border: 1px solid #EEE8DD;">
<div style="display: flex; justify-content: space-between; align-items: center;">
<sc-if value="{{s.beg}}" hint-placeholder-val="{{ true }}"><span style="height: 26px; padding: 0 10px; border-radius: 13px; background: #E3F0EC; color: #0A443E; font-size: 12px; font-weight: 700; display: flex; align-items: center;">Beginner · ආරම්භක</span></sc-if>
<sc-if value="{{s.int}}" hint-placeholder-val="{{ false }}"><span style="height: 26px; padding: 0 10px; border-radius: 13px; background: #FBEEDC; color: #7A4307; font-size: 12px; font-weight: 700; display: flex; align-items: center;">Intermediate · මධ්‍යම</span></sc-if>
<sc-if value="{{s.adv}}" hint-placeholder-val="{{ false }}"><span style="height: 26px; padding: 0 10px; border-radius: 13px; background: #16181D; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center;">Advanced · උසස්</span></sc-if>
<div style="display: flex; gap: 2px;">
<button aria-label="Save sentence" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: transparent; color: #5B606B; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg></button>
<button aria-label="Copy sentence" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: transparent; color: #5B606B; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg></button>
</div>
</div>
<p style="margin: 0; font-size: 20px; font-weight: 700; line-height: 1.35;">{{s.en}}</p>
<div style="display: flex; flex-direction: column; gap: 2px;">
<p style="margin: 0; font-size: 16px; color: #9A5409;">{{s.pr}}</p>
<p style="margin: 0; font-size: 17px; color: #0E5A52;">{{s.si}}</p>
</div>
</article>
</sc-for>
</main>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1400}}'>
class Component extends DCLogic {
  renderVals() {
    const items = [
      { en: 'Could you give me a minute?', pr: 'කුඩ් යූ ගිව් මී අ මිනිට්?', si: 'මට විනාඩියක් දෙන්න පුළුවන්ද?', lvl: 'beg' },
      { en: 'I’m running a little late.', pr: 'අයිම් රනිං අ ලිට්ල් ලේට්.', si: 'මම ටිකක් පරක්කු වෙනවා.', lvl: 'beg' },
      { en: 'Let me look into it.', pr: 'ලෙට් මී ලුක් ඉන්ටු ඉට්.', si: 'මම ඒ ගැන සොයා බලන්නම්.', lvl: 'beg' },
      { en: 'Can we reschedule the meeting?', pr: 'කෑන් වී රීෂෙඩියුල් ද මීටිං?', si: 'අපිට රැස්වීම වෙන වෙලාවකට දාන්න පුළුවන්ද?', lvl: 'int' },
      { en: 'I’ll get back to you shortly.', pr: 'අයිල් ගෙට් බැක් ටු යූ ෂෝට්ලි.', si: 'මම ඉක්මනින් ඔබට පිළිතුරු දෙන්නම්.', lvl: 'int' },
      { en: 'I’d appreciate your feedback.', pr: 'අයිඩ් අප්‍රීෂියේට් යෝ ෆීඩ්බැක්.', si: 'ඔබේ අදහස් ලැබුණොත් මම ගොඩක් කෘතඥ වෙනවා.', lvl: 'adv' }
    ];
    return {
      items: items.map((s) => ({ ...s, beg: s.lvl === 'beg', int: s.lvl === 'int', adv: s.lvl === 'adv' }))
    };
  }
}
</script>

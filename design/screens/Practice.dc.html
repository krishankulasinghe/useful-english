<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Practice flashcards</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;family=Noto+Sans+Sinhala:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans','Noto Sans Sinhala',sans-serif;background:#F7F4EE;color:#16181D;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:#0E5A52;text-decoration:none}a:hover{color:#0A443E}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F7F4EE; overflow: hidden;">
<main style="flex-grow: 1; padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 14px; overflow: hidden;">
<header style="display: flex; align-items: flex-end; justify-content: space-between;">
<div style="display: flex; flex-direction: column;">
<h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 28px; line-height: 1.15;">Practice</h1>
<span style="font-size: 14px; color: #5B606B;">පුහුණුව · Verbs</span>
</div>
<span style="font-size: 14px; font-weight: 700; color: #3B3F48;">{{counter}}</span>
</header>
<div aria-hidden="true" style="height: 6px; border-radius: 3px; background: #E7E1D6; overflow: hidden;">
<div style="height: 6px; border-radius: 3px; background: #0E5A52; width: {{pct}};"></div>
</div>

<div role="group" aria-label="Card direction" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px; background: #EEEAE2;">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
<sc-if value="{{m.selected}}" hint-placeholder-val="{{ false }}"><button onClick="{{m.pick}}" aria-pressed="true" style="height: 40px; border: none; border-radius: 10px; background: #FFFFFF; color: #0E5A52; font-size: 14px; font-weight: 700; box-shadow: 0 1px 3px rgba(22,24,29,0.10); cursor: pointer;">{{m.label}}</button></sc-if>
<sc-if value="{{m.unselected}}" hint-placeholder-val="{{ true }}"><button onClick="{{m.pick}}" aria-pressed="false" style="height: 40px; border: none; border-radius: 10px; background: transparent; color: #3B3F48; font-size: 14px; font-weight: 600; cursor: pointer;">{{m.label}}</button></sc-if>
</sc-for>
</div>

<section aria-live="polite" style="flex-grow: 1; background: #FFFFFF; border-radius: 28px; padding: 24px; display: flex; flex-direction: column; justify-content: center; gap: 14px; box-shadow: 0 1px 2px rgba(22,24,29,0.04), 0 14px 40px rgba(22,24,29,0.08);">
<sc-if value="{{enFront}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;">
<span style="font-family: 'Fraunces', Georgia, serif; font-size: 52px; font-weight: 600; line-height: 1.05; letter-spacing: -0.02em;">{{card.en}}</span>
<span style="font-size: 22px; font-weight: 600; color: #9A5409;">{{card.pr}}</span>
</div>
</sc-if>
<sc-if value="{{siFront}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.04em; color: #5B606B;">WHAT IS THIS IN ENGLISH?</span>
<span style="font-size: 34px; font-weight: 600; color: #0E5A52; line-height: 1.4;">{{card.si}}</span>
</div>
</sc-if>

<sc-if value="{{revealed}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 12px;">
<div style="height: 1px; background: #EEE8DD;"></div>
<sc-if value="{{enFront}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; align-items: center; text-align: center;">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.04em; color: #5B606B;">තේරුම · MEANING</span>
<span style="font-size: 28px; font-weight: 600; color: #0E5A52; line-height: 1.45;">{{card.si}}</span>
</div>
</sc-if>
<sc-if value="{{siFront}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; align-items: center; text-align: center;">
<span style="font-family: 'Fraunces', Georgia, serif; font-size: 40px; font-weight: 600; line-height: 1.1;">{{card.en}}</span>
<span style="font-size: 20px; font-weight: 600; color: #9A5409;">{{card.pr}}</span>
</div>
</sc-if>
<div style="background: #F7F4EE; border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px;">
<span style="font-size: 16px; font-weight: 600;">{{card.ex}}</span>
<span style="font-size: 14px; color: #9A5409;">{{card.exPr}}</span>
<span style="font-size: 15px; color: #0E5A52;">{{card.exSi}}</span>
</div>
</div>
</sc-if>
</section>

<sc-if value="{{hidden}}" hint-placeholder-val="{{ true }}">
<button onClick="{{reveal}}" style="height: 56px; border: none; border-radius: 28px; background: #0E5A52; color: #FFFFFF; font-size: 17px; font-weight: 700; cursor: pointer;">{{revealLabel}}</button>
</sc-if>
<sc-if value="{{revealed}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; gap: 10px;">
<button onClick="{{again}}" style="flex-grow: 1; flex-basis: 0; height: 56px; border-radius: 28px; border: 1.5px solid #CFC7B8; background: #FFFFFF; color: #16181D; font-size: 16px; font-weight: 700; cursor: pointer;">Still learning</button>
<button onClick="{{know}}" style="flex-grow: 1; flex-basis: 0; height: 56px; border: none; border-radius: 28px; background: #0E5A52; color: #FFFFFF; font-size: 16px; font-weight: 700; cursor: pointer;">I know this</button>
</div>
</sc-if>
</main>

<nav aria-label="Main" style="flex-shrink: 0; height: 84px; box-sizing: border-box; padding: 8px 8px 20px; background: #FFFFFF; border-top: 1px solid #E7E1D6; display: flex;">
<a href="Main.dc.html" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #5B606B; font-size: 12px; font-weight: 500;"><span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg></span>Home</a>
<a href="Vocabulary.dc.html" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #5B606B; font-size: 12px; font-weight: 500;"><span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"></path><path d="M4 21V5"></path><path d="M8 7h7"></path></svg></span>Words</a>
<a href="Sentences.dc.html" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #5B606B; font-size: 12px; font-weight: 500;"><span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12z"></path></svg></span>Sentences</a>
<a href="Practice.dc.html" aria-current="page" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #0E5A52; font-size: 12px; font-weight: 700;"><span style="width: 56px; height: 30px; border-radius: 15px; background: #E3F0EC; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="14" height="14" rx="2"></rect><path d="M7 3h12a2 2 0 0 1 2 2v12"></path></svg></span>Practice</a>
<a href="Settings.dc.html" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #5B606B; font-size: 12px; font-weight: 500;"><span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 12a3 3 0 1 1-6 0a3 3 0 1 1 6 0z"></path><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></span>Settings</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { idx: 0, revealed: false, mode: 'en' };
  }
  renderVals() {
    const deck = [
      { en: 'Borrow', pr: 'බොරෝ', si: 'ණයට ගන්නවා', ex: 'Can I borrow your pen?', exPr: 'කෑන් අයි බොරෝ යෝ පෙන්?', exSi: 'මට ඔයාගේ පෑන ණයට ගන්න පුළුවන්ද?' },
      { en: 'Explain', pr: 'එක්ස්ප්ලේන්', si: 'පැහැදිලි කරනවා', ex: 'Could you explain it again?', exPr: 'කුඩ් යූ එක්ස්ප්ලේන් ඉට් අගේන්?', exSi: 'ඔයාට ඒක ආයෙත් පැහැදිලි කරන්න පුළුවන්ද?' },
      { en: 'Improve', pr: 'ඉම්ප්‍රූව්', si: 'වැඩිදියුණු කරනවා', ex: 'I want to improve my English.', exPr: 'අයි වොන්ට් ටු ඉම්ප්‍රූව් මයි ඉංග්ලිෂ්.', exSi: 'මට මගේ ඉංග්‍රීසි දැනුම වැඩිදියුණු කරගන්න ඕනේ.' },
      { en: 'Reach', pr: 'රීච්', si: 'ළඟා වෙනවා', ex: 'I reached home at 8 PM.', exPr: 'අයි රීච්ඩ් හෝම් ඇට් එයිට් පීඑම්.', exSi: 'මම රාත්‍රී 8ට ගෙදරට ළඟා වුණා.' }
    ];
    const s = this.state;
    const advance = () => this.setState({ idx: (s.idx + 1) % deck.length, revealed: false });
    const modes = [
      { id: 'en', label: 'English → සිංහල' },
      { id: 'si', label: 'සිංහල → English' }
    ];
    return {
      card: deck[s.idx],
      counter: (s.idx + 1) + ' of ' + deck.length,
      pct: Math.round(((s.idx + 1) / deck.length) * 100) + '%',
      enFront: s.mode === 'en',
      siFront: s.mode === 'si',
      revealed: s.revealed,
      hidden: !s.revealed,
      revealLabel: s.mode === 'en' ? 'Show meaning · තේරුම බලන්න' : 'Show English · ඉංග්‍රීසි බලන්න',
      reveal: () => this.setState({ revealed: true }),
      again: advance,
      know: advance,
      modes: modes.map((m) => ({
        ...m,
        selected: s.mode === m.id,
        unselected: s.mode !== m.id,
        pick: () => this.setState({ mode: m.id, revealed: false })
      }))
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Set a daily goal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;family=Noto+Sans+Sinhala:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans','Noto Sans Sinhala',sans-serif;background:#F7F4EE;color:#16181D;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:#0E5A52;text-decoration:none}a:hover{color:#0A443E}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F7F4EE; padding: 12px 24px 40px; overflow: hidden;">
<div style="display: flex; align-items: center; justify-content: space-between;">
<a href="Onboarding2.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E7E1D6; box-sizing: border-box; color: #16181D; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
<div aria-label="Step 3 of 3" style="display: flex; gap: 6px;">
<span style="width: 8px; height: 8px; border-radius: 4px; background: #CFC7B8;"></span>
<span style="width: 8px; height: 8px; border-radius: 4px; background: #CFC7B8;"></span>
<span style="width: 24px; height: 8px; border-radius: 4px; background: #0E5A52;"></span>
</div>
<span style="width: 44px; height: 44px;"></span>
</div>

<div style="display: flex; flex-direction: column; gap: 6px; margin-top: 28px;">
<h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-size: 30px; font-weight: 600; line-height: 1.15;">Set a daily goal</h1>
<p style="margin: 0; font-size: 17px; color: #3B3F48;">දිනකට වචන කීයක් ඉගෙන ගන්නද?</p>
</div>

<div role="radiogroup" aria-label="Daily goal" style="display: flex; flex-direction: column; gap: 12px; margin-top: 24px;">
<sc-for list="{{goals}}" as="g" hint-placeholder-count="3">
<sc-if value="{{g.selected}}" hint-placeholder-val="{{ false }}">
<button role="radio" aria-checked="true" onClick="{{g.pick}}" style="text-align: left; border: 2px solid #0E5A52; background: #F1F8F6; border-radius: 20px; padding: 14px 18px; display: flex; align-items: center; gap: 14px; cursor: pointer; color: #16181D;">
<span style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 16px; background: #0E5A52; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', Georgia, serif; font-size: 24px; font-weight: 600;">{{g.n}}</span>
<span style="flex-grow: 1; display: flex; flex-direction: column;"><span style="font-size: 17px; font-weight: 700;">{{g.en}}</span><span style="font-size: 14px; color: #3B3F48;">{{g.si}}</span></span>
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E5A52" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>
</button>
</sc-if>
<sc-if value="{{g.unselected}}" hint-placeholder-val="{{ true }}">
<button role="radio" aria-checked="false" onClick="{{g.pick}}" style="text-align: left; border: 2px solid #EEE8DD; background: #FFFFFF; border-radius: 20px; padding: 14px 18px; display: flex; align-items: center; gap: 14px; cursor: pointer; color: #16181D;">
<span style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 16px; background: #EEEAE2; color: #16181D; display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', Georgia, serif; font-size: 24px; font-weight: 600;">{{g.n}}</span>
<span style="flex-grow: 1; display: flex; flex-direction: column;"><span style="font-size: 17px; font-weight: 700;">{{g.en}}</span><span style="font-size: 14px; color: #3B3F48;">{{g.si}}</span></span>
</button>
</sc-if>
</sc-for>
</div>

<div style="margin-top: 16px; background: #FFFFFF; border: 1px solid #EEE8DD; border-radius: 20px; padding: 14px 18px; display: flex; align-items: center; gap: 14px;">
<span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; background: #FBEEDC; color: #9A5409; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"></path></svg></span>
<span style="flex-grow: 1; display: flex; flex-direction: column;"><span style="font-size: 16px; font-weight: 700;">Daily reminder</span><span style="font-size: 14px; color: #3B3F48;">හැමදාම 7:30 PM ට මතක් කරන්න</span></span>
<button role="switch" aria-checked="{{remindOn}}" aria-label="Daily reminder" onClick="{{toggleRemind}}" style="width: 52px; height: 32px; flex-shrink: 0; border-radius: 16px; border: none; padding: 3px; display: flex; cursor: pointer; background: {{remindBg}}; justify-content: {{remindJc}};"><span style="width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,0.2);"></span></button>
</div>

<a href="Main.dc.html" style="margin-top: auto; height: 56px; border-radius: 28px; background: #0E5A52; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700;">Start learning · පටන් ගමු</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { goal: 10, remind: true };
  }
  renderVals() {
    const s = this.state;
    const goals = [
      { n: 5, en: 'Casual · 5 words a day', si: 'සැහැල්ලුවෙන් · දිනකට වචන 5ක්' },
      { n: 10, en: 'Regular · 10 words a day', si: 'නිතිපතා · දිනකට වචන 10ක්' },
      { n: 20, en: 'Serious · 20 words a day', si: 'උනන්දුවෙන් · දිනකට වචන 20ක්' }
    ];
    return {
      goals: goals.map((g) => ({
        ...g,
        selected: s.goal === g.n,
        unselected: s.goal !== g.n,
        pick: () => this.setState({ goal: g.n })
      })),
      remindOn: s.remind ? 'true' : 'false',
      remindBg: s.remind ? '#0E5A52' : '#CFC7B8',
      remindJc: s.remind ? 'flex-end' : 'flex-start',
      toggleRemind: () => this.setState({ remind: !s.remind })
    };
  }
}
</script>
</body>
</html>

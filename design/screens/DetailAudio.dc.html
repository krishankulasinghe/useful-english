<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Word detail with audio (Phase 2)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;family=Noto+Sans+Sinhala:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans','Noto Sans Sinhala',sans-serif;background:#F7F4EE;color:#16181D;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:#0E5A52;text-decoration:none}a:hover{color:#0A443E}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F7F4EE; overflow: hidden;">
<header style="flex-shrink: 0; padding: 12px 16px 4px; display: flex; align-items: center; justify-content: space-between;">
<a href="WordList.dc.html" aria-label="Back to Verbs" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E7E1D6; box-sizing: border-box; color: #16181D; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
<span style="font-size: 14px; font-weight: 600; color: #5B606B;">Verbs · ක්‍රියා පද</span>
<button aria-label="Save word" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E7E1D6; color: #0E5A52; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="#0E5A52" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg></button>
</header>

<main style="flex-grow: 1; padding: 12px 20px 16px; display: flex; flex-direction: column; gap: 14px; overflow: hidden;">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
<div style="display: flex; flex-direction: column; gap: 8px;">
<h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-size: 58px; font-weight: 600; line-height: 1; letter-spacing: -0.02em;">Reach</h1>
<span style="align-self: flex-start; height: 28px; padding: 0 12px; border-radius: 14px; background: #EEEAE2; color: #3B3F48; font-size: 13px; font-weight: 600; display: flex; align-items: center;">verb · ක්‍රියා පදය</span>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
<button onClick="{{toggle}}" aria-label="Play pronunciation" style="width: 68px; height: 68px; border-radius: 34px; border: none; background: #0E5A52; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 0 0 {{ring}} #E3F0EC;"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path></svg></button>
<span style="font-size: 12px; font-weight: 600; color: #0E5A52;">{{playLabel}}</span>
</div>
</div>

<div role="group" aria-label="Playback speed" style="display: flex; gap: 8px;">
<sc-for list="{{speeds}}" as="sp" hint-placeholder-count="2">
<sc-if value="{{sp.selected}}" hint-placeholder-val="{{ false }}"><button onClick="{{sp.pick}}" aria-pressed="true" style="height: 36px; padding: 0 14px; border-radius: 18px; border: none; background: #16181D; color: #FFFFFF; font-size: 13px; font-weight: 700; cursor: pointer;">{{sp.label}}</button></sc-if>
<sc-if value="{{sp.unselected}}" hint-placeholder-val="{{ true }}"><button onClick="{{sp.pick}}" aria-pressed="false" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #E7E1D6; background: #FFFFFF; color: #3B3F48; font-size: 13px; font-weight: 600; cursor: pointer;">{{sp.label}}</button></sc-if>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 10px;">
<div style="background: #FBEEDC; border-radius: 20px; padding: 14px 18px; display: flex; flex-direction: column; gap: 2px;">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.04em; color: #7A4307;">උච්චාරණය · PRONUNCIATION</span>
<span style="font-size: 30px; font-weight: 600; color: #9A5409; line-height: 1.4;">රීච්</span>
</div>
<div style="background: #E3F0EC; border-radius: 20px; padding: 14px 18px; display: flex; flex-direction: column; gap: 2px;">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.04em; color: #0A443E;">තේරුම · MEANING</span>
<span style="font-size: 28px; font-weight: 600; color: #0E5A52; line-height: 1.4;">ළඟා වෙනවා</span>
</div>
</div>

<section aria-label="Example" style="background: #FFFFFF; border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 1px 2px rgba(22,24,29,0.04), 0 10px 30px rgba(22,24,29,0.06);">
<div style="display: flex; justify-content: space-between; align-items: center;">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.04em; color: #5B606B;">උදාහරණය · EXAMPLE</span>
<button aria-label="Play example sentence" style="height: 36px; padding: 0 12px 0 10px; border-radius: 18px; border: 1px solid #CFE3DD; background: #E3F0EC; color: #0E5A52; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; cursor: pointer;"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z"></path></svg>Listen</button>
</div>
<p style="margin: 0; font-size: 20px; font-weight: 700; line-height: 1.35;">I <span style="text-decoration: underline; text-decoration-color: #0E5A52; text-decoration-thickness: 2px; text-underline-offset: 4px;">reached</span> home at 8 PM.</p>
<p style="margin: 0; font-size: 16px; color: #9A5409;">අයි රීච්ඩ් හෝම් ඇට් එයිට් පීඑම්.</p>
<p style="margin: 0; font-size: 17px; color: #0E5A52;">මම රාත්‍රී 8ට ගෙදරට ළඟා වුණා.</p>
</section>
</main>

<footer style="flex-shrink: 0; padding: 12px 20px 28px; display: flex; gap: 10px; background: #F7F4EE; border-top: 1px solid #E7E1D6;">
<button style="flex-grow: 1; flex-basis: 0; height: 54px; border-radius: 27px; border: 1.5px solid #0E5A52; background: #FFFFFF; color: #0E5A52; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>I know it</button>
<a href="#" style="flex-grow: 1; flex-basis: 0; height: 54px; border-radius: 27px; background: #0E5A52; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px;">Next word<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { playing: false, speed: 'normal' };
  }
  renderVals() {
    const s = this.state;
    const speeds = [
      { id: 'normal', label: 'Normal · 1×' },
      { id: 'slow', label: 'Slow · 0.75×' }
    ];
    return {
      ring: s.playing ? '8px' : '0px',
      playLabel: s.playing ? 'Playing…' : 'Listen',
      toggle: () => this.setState({ playing: !s.playing }),
      speeds: speeds.map((sp) => ({
        ...sp,
        selected: s.speed === sp.id,
        unselected: s.speed !== sp.id,
        pick: () => this.setState({ speed: sp.id })
      }))
    };
  }
}
</script>
</body>
</html>

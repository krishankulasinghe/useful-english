<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Verbs word list</title>

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&amp;family=Noto+Sans+Sinhala:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans','Noto Sans Sinhala',sans-serif;background:#F7F4EE;color:#16181D;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:#0E5A52;text-decoration:none}a:hover{color:#0A443E}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F7F4EE; overflow: hidden;">
<header style="flex-shrink: 0; padding: 12px 16px 8px; display: flex; align-items: center; justify-content: space-between;">
<a href="Vocabulary.dc.html" aria-label="Back to categories" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E7E1D6; box-sizing: border-box; color: #16181D; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
<div style="display: flex; flex-direction: column; align-items: center;">
<h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 24px; line-height: 1.2;">Verbs</h1>
<span style="font-size: 13px; color: #5B606B;">ක්‍රියා පද</span>
</div>
<button aria-label="Search verbs" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E7E1D6; color: #16181D; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></button>
</header>

<main style="flex-grow: 1; padding: 8px 20px 16px; display: flex; flex-direction: column; gap: 10px; overflow: hidden;">
<p style="margin: 0 0 4px; font-size: 14px; color: #5B606B;">Tap a word to learn it · වචනයක් තෝරන්න</p>
<sc-for list="{{words}}" as="w" hint-placeholder-count="6">
<a href="{{w.href}}" style="background: #FFFFFF; border-radius: 18px; padding: 12px 16px; min-height: 78px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; color: #16181D; border: 1px solid #EEE8DD;">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 0px; min-width: 0;">
<div style="display: flex; align-items: baseline; gap: 10px;">
<span style="font-family: 'Fraunces', Georgia, serif; font-size: 23px; font-weight: 600; line-height: 1.25;">{{w.en}}</span>
<span style="font-size: 15px; font-weight: 600; color: #9A5409;">{{w.pr}}</span>
</div>
<span style="font-size: 16px; color: #0E5A52;">{{w.si}}</span>
</div>
<sc-if value="{{w.learned}}" hint-placeholder-val="{{ false }}"><span aria-label="Learned" style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 14px; background: #E3F0EC; color: #0E5A52; display: flex; align-items: center; justify-content: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></span></sc-if>
<sc-if value="{{w.todo}}" hint-placeholder-val="{{ true }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5B606B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></sc-if>
</a>
</sc-for>
<a href="Practice.dc.html" style="margin-top: auto; height: 52px; border-radius: 26px; background: #16181D; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; font-weight: 700;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="14" height="14" rx="2"></rect><path d="M7 3h12a2 2 0 0 1 2 2v12"></path></svg>Practice these words</a>
</main>

<a href="Sentences.dc.html" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #5B606B; font-size: 12px; font-weight: 500;"><span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12z"></path></svg></span>Sentences</a>
<a href="Practice.dc.html" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #5B606B; font-size: 12px; font-weight: 500;"><span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="14" height="14" rx="2"></rect><path d="M7 3h12a2 2 0 0 1 2 2v12"></path></svg></span>Practice</a>
<a href="Settings.dc.html" style="flex-grow: 1; flex-basis: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #5B606B; font-size: 12px; font-weight: 500;"><span style="width: 56px; height: 30px; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 12a3 3 0 1 1-6 0a3 3 0 1 1 6 0z"></path><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></span>Settings</a>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const words = [
      { en: 'Reach', pr: 'රීච්', si: 'ළඟා වෙනවා', learned: true },
      { en: 'Borrow', pr: 'බොරෝ', si: 'ණයට ගන්නවා', learned: true },
      { en: 'Arrange', pr: 'අරේන්ජ්', si: 'සකස් කරනවා', learned: false },
      { en: 'Explain', pr: 'එක්ස්ප්ලේන්', si: 'පැහැදිලි කරනවා', learned: false },
      { en: 'Avoid', pr: 'අවොයිඩ්', si: 'වළක්වා ගන්නවා', learned: false },
      { en: 'Improve', pr: 'ඉම්ප්‍රූව්', si: 'වැඩිදියුණු කරනවා', learned: false }

</script>

<style>

<div style="padding: 0 20px; display: flex; flex-direction: column; gap: 16px;">
<header style="display: flex; flex-direction: column; gap: 0px;">
<h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 32px; line-height: 1.15; letter-spacing: -0.01em;">Vocabulary</h1>

</header>
<label style="height: 52px; box-sizing: border-box; border-radius: 16px; background: #FFFFFF; border: 1px solid #E7E1D6; display: flex; align-items: center; gap: 10px; padding: 0 16px; color: #5B606B;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Search words or categories</span>

</label>
</div>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
<section style="display: flex; flex-direction: column; gap: 10px;">
<div style="padding: 0 20px; display: flex; align-items: baseline; justify-content: space-between;">
<div style="display: flex; align-items: baseline; gap: 8px;">
<h2 style="margin: 0; font-size: 18px; font-weight: 700;">{{g.en}}</h2>
<span style="font-size: 13px; color: #5B606B;">{{g.si}}</span>
</div>
<a href="VocabCollection.dc.html" style="font-size: 14px; font-weight: 700; color: #0E5A52; min-height: 32px; display: flex; align-items: center;">See all</a>
</div>
<div style="display: flex; gap: 10px; overflow: hidden; padding: 0 20px;">
<sc-for list="{{g.cats}}" as="c" hint-placeholder-count="3">
<a href="WordList.dc.html" style="flex-shrink: 0; width: 136px; min-height: 112px; box-sizing: border-box; background: #FFFFFF; border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 10px; color: #16181D; border: 1px solid #EEE8DD;">
<sc-if value="{{g.teal}}" hint-placeholder-val="{{ true }}"><span style="width: 34px; height: 34px; border-radius: 11px; background: #E3F0EC; color: #0E5A52; display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 17px;">{{c.letter}}</span></sc-if>
<sc-if value="{{g.saffron}}" hint-placeholder-val="{{ false }}"><span style="width: 34px; height: 34px; border-radius: 11px; background: #FBEEDC; color: #9A5409; display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 17px;">{{c.letter}}</span></sc-if>
<div style="display: flex; flex-direction: column; margin-top: auto;">
<span style="font-size: 14px; font-weight: 700; line-height: 1.25;">{{c.en}}</span>
<span style="font-size: 12.5px; color: #5B606B;">{{c.si}}</span>
</div>
</a>
</sc-for>
</div>
</section>
</sc-for>
</main>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
  renderVals() {
    const groups = [
      { en: 'Grammar Basics', si: 'ව්‍යාකරණ මූලික', cats: [['Everyday English', 'එදිනෙදා ඉංග්‍රීසි'], ['Verbs', 'ක්‍රියා පද'], ['Irregular Verbs', 'අක්‍රමවත් ක්‍රියා පද'], ['Nouns', 'නාම පද'], ['Adjectives', 'විශේෂණ පද'], ['Phrasal Verbs', 'වාක්‍යාංශ ක්‍රියා පද'], ['Proverbs', 'පිරුළු']] },
      { en: 'People & Life', si: 'මිනිසුන් සහ ජීවිතය', cats: [['Family & Relationships', 'පවුල සහ ඥාතීන්'], ['People & Body', 'මිනිසුන් සහ ශරීරය'], ['Health & Diseases', 'සෞඛ්‍යය සහ රෝග'], ['Professions', 'වෘත්තීන්'], ['Clothes & Accessories', 'ඇඳුම් සහ උපාංග'], ['Home & Household', 'නිවස සහ ගෘහ භාණ්ඩ'], ['Religion', 'ආගම']] },
      { en: 'Nature', si: 'සොබාදහම', cats: [['Animals', 'සතුන්'], ['Birds', 'පක්ෂීන්'], ['Fish & Insects', 'මාළු සහ කෘමීන්'], ['Plants & Trees', 'ශාක සහ ගස්'], ['Fruits & Vegetables', 'පළතුරු සහ එළවළු'], ['Agriculture', 'කෘෂිකර්මය'], ['Geography', 'භූගෝල විද්‍යාව']] },
      { en: 'Daily Life', si: 'එදිනෙදා ජීවිතය', cats: [['Food & Drinks', 'ආහාර සහ පාන'], ['Tools & Equipment', 'මෙවලම් සහ උපකරණ'], ['Vehicles & Transportation', 'වාහන සහ ප්‍රවාහනය'], ['Sports', 'ක්‍රීඩා'], ['Buildings & Construction', 'ගොඩනැගිලි සහ ඉදිකිරීම්'], ['Countries & Nationalities', 'රටවල් සහ ජාතීන්']] },
      { en: 'Work & Study', si: 'රැකියාව සහ අධ්‍යාපනය', cats: [['Money & Finance', 'මුදල් සහ මූල්‍ය'], ['Business & Commerce', 'ව්‍යාපාර සහ වාණිජ්‍යය'], ['Business English', 'ව්‍යාපාරික ඉංග්‍රීසි'], ['Legal English', 'නීතිමය ඉංග්‍රීසි'], ['Language & Literature', 'භාෂාව සහ සාහිත්‍යය'], ['Mathematics', 'ගණිතය'], ['Science', 'විද්‍යාව'], ['Technology & ICT', 'තාක්ෂණය සහ තොරතුරු තාක්ෂණය']] }
    ];
    return {
      groups: groups.map((g, i) => ({
        en: g.en, si: g.si, teal: i % 2 === 0, saffron: i % 2 === 1,
        cats: g.cats.map((c) => ({ en: c[0], si: c[1], letter: c[0].charAt(0) }))
      }))
    };
  }
}
</script>
